<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <div>
        <table border="1" cellspacing="0" align="center">
            <tr>
                <td width="200">Title A</td>
                <td colspan="4" width="300">Title B</td>
                <td colspan="4" width="260">Title C</td>
            </tr>
            <tr>
                <td  height="80"></td>
                <td colspan="4" rowspan="3" height="120"></td>
                <td colspan="4" rowspan="5">
                    <table border="1" cellspacing="0" align="center">
                        <tr>
                            <td width="150"><b>Item / Desc.</b></td>
                            <td width="40"><b>Qty.</b></td>
                            <td width="60"><b>@</b></td>
                            <td width="70"><b>Price</b></td>
                        </tr>
                        <tr>
                            <td>Paperclips (Box)</td>
                            <td>100</td>
                            <td>1.15</td>
                            <td>115.00</td>
                        </tr>
                        <tr>
                            <td>Paper (Case)</td>
                            <td>10</td>
                            <td>45.99</td>
                            <td>459.90</td>
                        </tr>
                        <tr>
                            <td>Wastepaper Baskets</td>
                            <td>2</td>
                            <td>17.99</td>
                            <td>35.98</td>
                        </tr>
                        <tr>
                            <td colspan="3"><b>Subtotal</b></td>
                            <td>610.88</td>
                        </tr>
                        <tr>
                            <td colspan="2"><b>Tax</b></td>
                            <td>7%</td>
                            <td>42.76</td>
                        </tr>
                        <tr>
                            <td colspan="3"><b>Total</b></td>
                            <td>653.64</td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td>Title D</td>
            </tr>
            <tr>
                <td rowspan="5"></td>
            </tr>
            <tr>
                <td colspan="4">Title E</td>
            </tr>
            <tr  height="120">
                <td colspan="4"></td>
            </tr>
            <tr>
                <td colspan="3" width="60">Title F</td>
                <td colspan="2">Title G</td>
                <td colspan="3" width="60">Title H</td>
            </tr>
            <tr  height="60">
                <td colspan="3"></td>
                <td colspan="2"></td>
                <td colspan="3"></td>

            </tr>

        </table>
    </div>
</body>
</html>
