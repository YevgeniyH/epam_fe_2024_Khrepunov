<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div>
        <center>
            <h1>Login</h1>
            <iframe width="300" height="600" frameborder="0" srcdoc ='
                        <form name="Authorization">
                            <fieldset>
                                <legend>Authorization</legend>
                                <table>
                                    <tr>
                                        <td width="70"><label for="login">Login</label></td>
                                        <td><input type="email" id="login" placeholder="user@user.com"></td>
                                    </tr>
                                    <tr>
                                        <td width="70"><label for="password">Password</label></td>
                                        <td><input type="password" id="password" placeholder="password"></td>
                                    </tr>
                                    <tr height="16">
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" align="center"><input type="button" value="Submit"></td>
                                    </tr>
                                </table>                      
                          </fieldset>
                        </form>
            ' >
            </iframe>
       </center>       
    </div>  
</body>
</html>
